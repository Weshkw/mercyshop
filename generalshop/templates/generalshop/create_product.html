{% extends "base.html" %}

{% block title %}Add product · Mercy Beauty Shop{% endblock %}

{% block content %}
<section class="card form-card form-card-wide">
    <h1>Add a product</h1>
    <form method="post" enctype="multipart/form-data" class="stacked-form">
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit" class="button button-primary button-block">Add product</button>
    </form>
</section>
{% endblock %}
