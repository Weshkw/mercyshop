{% extends "base.html" %}

{% block title %}Staff login · Mercy Beauty Shop{% endblock %}

{% block content %}
<section class="card form-card">
    <h1>Staff login</h1>
    {% if form.non_field_errors %}
    <p class="form-error">That ID number and password did not match. Try again.</p>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <label for="{{ form.username.id_for_label }}">ID number</label>
        {{ form.username }}
        <label for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="button button-primary button-block">Log in</button>
    </form>
</section>
{% endblock %}
